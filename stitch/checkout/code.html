<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Checkout | BookLoom</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed-variant": "#6c3a00",
                        "tertiary-fixed": "#ffdcc1",
                        "on-primary-fixed-variant": "#2b38aa",
                        "surface-variant": "#e2e3e0",
                        "surface-container": "#eeeeeb",
                        "surface-tint": "#4552c3",
                        "on-primary-container": "#faf7ff",
                        "primary-fixed-dim": "#bdc2ff",
                        "tertiary": "#874a00",
                        "outline-variant": "#c6c5d5",
                        "primary": "#404dbe",
                        "background": "#f9f9f6",
                        "on-error": "#ffffff",
                        "tertiary-container": "#aa5f00",
                        "on-error-container": "#93000a",
                        "surface-container-low": "#f4f4f1",
                        "secondary-fixed-dim": "#cfc5b7",
                        "on-tertiary-fixed": "#2e1500",
                        "inverse-primary": "#bdc2ff",
                        "error-container": "#ffdad6",
                        "on-primary": "#ffffff",
                        "surface-container-highest": "#e2e3e0",
                        "surface-bright": "#f9f9f6",
                        "primary-container": "#5a67d8",
                        "primary-fixed": "#dfe0ff",
                        "inverse-on-surface": "#f1f1ee",
                        "outline": "#767684",
                        "on-surface-variant": "#454653",
                        "on-secondary-fixed-variant": "#4c463b",
                        "on-surface": "#1a1c1b",
                        "on-secondary-fixed": "#201b12",
                        "on-tertiary-container": "#fff6f2",
                        "surface-dim": "#dadad7",
                        "on-primary-fixed": "#000965",
                        "inverse-surface": "#2f312f",
                        "tertiary-fixed-dim": "#ffb778",
                        "on-secondary-container": "#6b6358",
                        "surface": "#f9f9f6",
                        "secondary-container": "#ece1d2",
                        "secondary": "#655d52",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "on-background": "#1a1c1b",
                        "error": "#ba1a1a",
                        "secondary-fixed": "#ece1d2",
                        "surface-container-high": "#e8e8e5",
                        "on-secondary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "3xl": "1.5rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Manrope"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .font-manrope { font-family: 'Manrope', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .active-step-line { background: linear-gradient(90deg, #404dbe 0%, #ece1d2 100%); }
        .scale-98-on-click:active { transform: scale(0.98); }
        .cubic-bezier-standard { transition-timing-function: cubic-bezier(0.23, 1, 0.32, 1); }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface selection:bg-primary-fixed selection:text-on-primary-fixed min-h-screen">
<!-- Top Navigation Anchor (Suppressing Global Nav for Focused Task) -->
<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl flex justify-between items-center px-6 py-4">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-slate-100 transition-colors scale-98-on-click">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<span class="text-indigo-700 font-manrope font-bold tracking-tight text-xl italic">BookLoom</span>
<div class="w-10"></div> <!-- Spacer for symmetry -->
</header>
<main class="pt-24 pb-32 px-6 max-w-lg mx-auto">
<!-- Progress Indicator -->
<div class="mb-12">
<div class="flex justify-between items-center relative px-2">
<!-- Progress Line Background -->
<div class="absolute top-1/2 left-0 w-full h-[2px] bg-secondary-fixed -z-10 -translate-y-1/2"></div>
<!-- Active Progress Line -->
<div class="absolute top-1/2 left-0 w-1/2 h-[2px] active-step-line -z-10 -translate-y-1/2"></div>
<!-- Steps -->
<div class="flex flex-col items-center gap-2">
<div class="w-8 h-8 rounded-full bg-primary text-on-primary flex items-center justify-center text-sm font-bold">1</div>
<span class="text-[10px] font-manrope font-bold uppercase tracking-widest text-primary">Shipping</span>
</div>
<div class="flex flex-col items-center gap-2">
<div class="w-8 h-8 rounded-full bg-primary text-on-primary flex items-center justify-center text-sm font-bold">2</div>
<span class="text-[10px] font-manrope font-bold uppercase tracking-widest text-primary">Payment</span>
</div>
<div class="flex flex-col items-center gap-2">
<div class="w-8 h-8 rounded-full bg-secondary-fixed text-on-secondary-fixed flex items-center justify-center text-sm font-bold">3</div>
<span class="text-[10px] font-manrope font-bold uppercase tracking-widest text-slate-400">Review</span>
</div>
</div>
</div>
<section class="space-y-8">
<!-- Payment Section -->
<div class="space-y-6">
<h2 class="font-manrope font-extrabold text-display-md tracking-tight text-on-surface">Payment Method</h2>
<!-- Credit Card Bento-Style Form -->
<div class="bg-surface-container-lowest rounded-3xl p-6 shadow-[0_20px_40px_rgba(26,28,27,0.02)] space-y-5">
<div class="space-y-1.5">
<label class="text-[11px] font-manrope font-bold uppercase tracking-widest text-on-surface-variant px-1">Cardholder Name</label>
<input class="w-full bg-surface-container-highest border-none rounded-xl px-4 py-3 text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary/20 transition-all outline-none" placeholder="Julianne Moore" type="text"/>
</div>
<div class="space-y-1.5 relative">
<label class="text-[11px] font-manrope font-bold uppercase tracking-widest text-on-surface-variant px-1">Card Number</label>
<div class="relative">
<input class="w-full bg-surface-container-highest border-none rounded-xl px-4 py-3 text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary/20 transition-all outline-none" placeholder="**** **** **** 4242" type="text"/>
<div class="absolute right-4 top-1/2 -translate-y-1/2 flex gap-1">
<div class="w-6 h-4 bg-red-400/20 rounded-sm"></div>
<div class="w-6 h-4 bg-orange-400/20 rounded-sm"></div>
</div>
</div>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="space-y-1.5">
<label class="text-[11px] font-manrope font-bold uppercase tracking-widest text-on-surface-variant px-1">Expiry Date</label>
<input class="w-full bg-surface-container-highest border-none rounded-xl px-4 py-3 text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary/20 transition-all outline-none" placeholder="MM/YY" type="text"/>
</div>
<div class="space-y-1.5">
<label class="text-[11px] font-manrope font-bold uppercase tracking-widest text-on-surface-variant px-1">CVV</label>
<input class="w-full bg-surface-container-highest border-none rounded-xl px-4 py-3 text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary/20 transition-all outline-none" placeholder="***" type="password"/>
</div>
</div>
</div>
<!-- Alternative Methods (Tonal Layering) -->
<div class="flex gap-3 overflow-x-auto pb-2 -mx-1 px-1">
<button class="flex-shrink-0 bg-secondary-fixed text-on-secondary-fixed px-6 py-3 rounded-full font-manrope font-bold text-sm scale-98-on-click flex items-center gap-2">
<span class="material-symbols-outlined text-lg">account_balance_wallet</span>
                        Apple Pay
                    </button>
<button class="flex-shrink-0 bg-surface-container-low text-on-surface-variant px-6 py-3 rounded-full font-manrope font-bold text-sm scale-98-on-click flex items-center gap-2">
<span class="material-symbols-outlined text-lg">payments</span>
                        PayPal
                    </button>
</div>
</div>
<!-- Shipping Address Summary (Pre-filled) -->
<div class="space-y-4">
<div class="flex justify-between items-end">
<h2 class="font-manrope font-extrabold text-xl tracking-tight text-on-surface">Shipping Address</h2>
<button class="text-primary font-manrope font-bold text-xs uppercase tracking-widest">Edit</button>
</div>
<div class="bg-surface-container-low rounded-2xl p-5 flex items-start gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container-highest flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-on-surface-variant">location_on</span>
</div>
<div>
<p class="font-bold text-on-surface">Home</p>
<p class="text-sm text-on-surface-variant leading-relaxed">221B Baker Street, Marylebone<br/>London, NW1 6XE, UK</p>
</div>
</div>
</div>
<!-- Order Summary -->
<div class="space-y-4 pt-4">
<h2 class="font-manrope font-extrabold text-xl tracking-tight text-on-surface">Order Summary</h2>
<div class="space-y-3">
<div class="flex justify-between text-sm">
<span class="text-on-surface-variant">Items (3)</span>
<span class="text-on-surface font-medium">$84.50</span>
</div>
<div class="flex justify-between text-sm">
<span class="text-on-surface-variant">Shipping</span>
<span class="text-green-600 font-medium">Free</span>
</div>
<div class="flex justify-between text-sm pb-3">
<span class="text-on-surface-variant">Estimated Tax</span>
<span class="text-on-surface font-medium">$4.20</span>
</div>
<div class="pt-4 flex justify-between items-center">
<span class="font-manrope font-extrabold text-lg">Total</span>
<span class="font-manrope font-extrabold text-2xl text-primary">$88.70</span>
</div>
</div>
</div>
</section>
</main>
<!-- Final Action Sticky Bar -->
<footer class="fixed bottom-0 left-0 w-full bg-surface/90 backdrop-blur-2xl px-6 pt-4 pb-8 shadow-[0_-10px_40px_rgba(26,28,27,0.05)] z-50">
<div class="max-w-lg mx-auto space-y-4">
<div class="flex items-center gap-2 justify-center text-[10px] font-manrope font-bold uppercase tracking-widest text-on-surface-variant opacity-60">
<span class="material-symbols-outlined text-[14px]">lock</span>
                Secure Encrypted Checkout
            </div>
<button class="w-full bg-primary hover:bg-primary-container text-on-primary py-5 rounded-full font-manrope font-extrabold text-lg shadow-lg shadow-primary/20 transition-all scale-98-on-click cubic-bezier-standard flex items-center justify-center gap-3">
                Place Order
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</footer>
<!-- Visual Embellishment: Subtle background texture -->
<div class="fixed top-0 left-0 w-full h-full pointer-events-none -z-20 opacity-[0.03]">
<div class="absolute inset-0 bg-[radial-gradient(#404dbe_1px,transparent_1px)] [background-size:20px_20px]"></div>
</div>
</body></html>
