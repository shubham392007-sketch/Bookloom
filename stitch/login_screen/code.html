<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>BookLoom - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-tertiary-fixed-variant": "#6c3a00",
                      "tertiary-fixed": "#ffdcc1",
                      "on-primary-fixed-variant": "#2b38aa",
                      "surface-variant": "#e2e3e0",
                      "surface-container": "#eeeeeb",
                      "surface-tint": "#4552c3",
                      "on-primary-container": "#faf7ff",
                      "primary-fixed-dim": "#bdc2ff",
                      "tertiary": "#874a00",
                      "outline-variant": "#c6c5d5",
                      "primary": "#404dbe",
                      "background": "#f9f9f6",
                      "on-error": "#ffffff",
                      "tertiary-container": "#aa5f00",
                      "on-error-container": "#93000a",
                      "surface-container-low": "#f4f4f1",
                      "secondary-fixed-dim": "#cfc5b7",
                      "on-tertiary-fixed": "#2e1500",
                      "inverse-primary": "#bdc2ff",
                      "error-container": "#ffdad6",
                      "on-primary": "#ffffff",
                      "surface-container-highest": "#e2e3e0",
                      "surface-bright": "#f9f9f6",
                      "primary-container": "#5a67d8",
                      "primary-fixed": "#dfe0ff",
                      "inverse-on-surface": "#f1f1ee",
                      "outline": "#767684",
                      "on-surface-variant": "#454653",
                      "on-secondary-fixed-variant": "#4c463b",
                      "on-surface": "#1a1c1b",
                      "on-secondary-fixed": "#201b12",
                      "on-tertiary-container": "#fff6f2",
                      "surface-dim": "#dadad7",
                      "on-primary-fixed": "#000965",
                      "inverse-surface": "#2f312f",
                      "tertiary-fixed-dim": "#ffb778",
                      "on-secondary-container": "#6b6358",
                      "surface": "#f9f9f6",
                      "secondary-container": "#ece1d2",
                      "secondary": "#655d52",
                      "surface-container-lowest": "#ffffff",
                      "on-tertiary": "#ffffff",
                      "on-background": "#1a1c1b",
                      "error": "#ba1a1a",
                      "secondary-fixed": "#ece1d2",
                      "surface-container-high": "#e8e8e5",
                      "on-secondary": "#ffffff"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "1.5rem",
                      "full": "9999px"
              },
              "fontFamily": {
                      "headline": ["Manrope"],
                      "body": ["Inter"],
                      "label": ["Inter"]
              }
            },
          }
        }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .cubic-bezier-ease {
            transition-timing-function: cubic-bezier(0.23, 1, 0.32, 1);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body text-on-surface selection:bg-primary-fixed selection:text-on-primary-fixed">
<main class="min-h-screen flex flex-col items-center justify-center px-8 relative overflow-hidden">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary-fixed/20 blur-[120px] rounded-full"></div>
<div class="absolute bottom-[-5%] right-[-5%] w-[30%] h-[30%] bg-secondary-fixed/30 blur-[100px] rounded-full"></div>
<div class="w-full max-w-[400px] z-10">
<header class="mb-12 text-center">
<div class="inline-flex items-center justify-center w-16 h-16 bg-surface-container-lowest rounded-xl mb-6 shadow-sm">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="auto_stories">auto_stories</span>
</div>
<h1 class="font-headline font-extrabold text-display-md tracking-tighter text-on-surface mb-2 italic">BookLoom</h1>
<p class="font-body text-on-surface-variant text-sm tracking-tight">Your digital atelier of curated stories.</p>
</header>
<form class="space-y-4">
<div class="space-y-2">
<label class="font-label text-label-md text-on-surface-variant ml-1 font-medium" for="email">Email</label>
<div class="relative">
<input class="w-full h-14 px-5 bg-surface-container-highest border-none rounded-xl text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all cubic-bezier-ease duration-300 outline-none" id="email" placeholder="name@example.com" type="email"/>
</div>
</div>
<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<label class="font-label text-label-md text-on-surface-variant font-medium" for="password">Password</label>
<a class="text-secondary font-medium text-xs hover:text-primary transition-colors duration-300" href="#">Forgot password?</a>
</div>
<div class="relative">
<input class="w-full h-14 px-5 bg-surface-container-highest border-none rounded-xl text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all cubic-bezier-ease duration-300 outline-none" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="pt-4">
<button class="w-full h-14 bg-gradient-to-br from-primary to-primary-container text-on-primary font-headline font-bold rounded-full shadow-lg shadow-primary/10 hover:scale-[1.02] active:scale-[0.98] transition-all cubic-bezier-ease duration-300" type="submit">
                        Sign In
                    </button>
</div>
</form>
<div class="mt-12 flex flex-col items-center">
<div class="relative w-full flex items-center justify-center mb-8">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/30"></div>
</div>
<span class="relative bg-surface px-4 text-xs font-label text-outline uppercase tracking-widest">or continue with</span>
</div>
<div class="flex gap-4 w-full">
<button class="flex-1 h-12 bg-surface-container-lowest rounded-xl flex items-center justify-center hover:bg-surface-container transition-colors duration-300">
<img alt="Google" class="w-5 h-5" data-alt="clean vector icon of the google logo in its brand colors on a transparent background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCyhzPGf14msMgSIdi8MDNPFJ8PJnQTFqayfeBj9NYoTQWXTUrIiJOs6d4jeHMrF9FQoxfiYztFdCnHL99Dqom-cMskePhjc6-L4Li1lMzZ2XGbtZrmpEhJkDtKvW26fzivmyx8AHra-Y9QKh7Qskqw5ok5EXzhhVa7u7d8Yka7h9hoeNXR6Dm0vtWU--qNux9cC2LA5rDgBlMSxfxMiRIzG_iozcSYo6cpo5-SAipd_lZflxNSGOUjnDpE9u0Yy8AnPVvs-E0yNX73"/>
</button>
<button class="flex-1 h-12 bg-surface-container-lowest rounded-xl flex items-center justify-center hover:bg-surface-container transition-colors duration-300">
<span class="material-symbols-outlined text-on-surface text-xl" data-icon="apple">ios</span>
</button>
</div>
<p class="mt-10 font-body text-sm text-on-surface-variant">
                    New to the atelier? <a class="text-primary font-semibold hover:underline underline-offset-4 decoration-primary/30" href="#">Create an account</a>
</p>
</div>
</div>
<footer class="absolute bottom-8 text-center px-4">
<p class="text-[10px] font-label text-outline uppercase tracking-[0.2em] leading-relaxed">
                By entering, you agree to our <br/>
<a class="underline underline-offset-2" href="#">Terms of Service</a> and <a class="underline underline-offset-2" href="#">Privacy Policy</a>
</p>
</footer>
</main>
<div class="fixed top-12 left-1/2 -translate-x-1/2 md:block hidden">
<div class="px-6 py-3 bg-surface-container-lowest/80 backdrop-blur-md rounded-full border border-outline-variant/10 shadow-sm flex items-center gap-3">
<div class="w-2 h-2 rounded-full bg-primary animate-pulse"></div>
<span class="text-xs font-medium text-on-surface-variant">Secure Session Active</span>
</div>
</div>
</body></html>
