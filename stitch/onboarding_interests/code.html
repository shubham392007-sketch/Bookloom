<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;400;500;600;700;800&amp;family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-tertiary-fixed-variant": "#6c3a00",
                    "tertiary-fixed": "#ffdcc1",
                    "on-primary-fixed-variant": "#2b38aa",
                    "surface-variant": "#e2e3e0",
                    "surface-container": "#eeeeeb",
                    "surface-tint": "#4552c3",
                    "on-primary-container": "#faf7ff",
                    "primary-fixed-dim": "#bdc2ff",
                    "tertiary": "#874a00",
                    "outline-variant": "#c6c5d5",
                    "primary": "#404dbe",
                    "background": "#f9f9f6",
                    "on-error": "#ffffff",
                    "tertiary-container": "#aa5f00",
                    "on-error-container": "#93000a",
                    "surface-container-low": "#f4f4f1",
                    "secondary-fixed-dim": "#cfc5b7",
                    "on-tertiary-fixed": "#2e1500",
                    "inverse-primary": "#bdc2ff",
                    "error-container": "#ffdad6",
                    "on-primary": "#ffffff",
                    "surface-container-highest": "#e2e3e0",
                    "surface-bright": "#f9f9f6",
                    "primary-container": "#5a67d8",
                    "primary-fixed": "#dfe0ff",
                    "inverse-on-surface": "#f1f1ee",
                    "outline": "#767684",
                    "on-surface-variant": "#454653",
                    "on-secondary-fixed-variant": "#4c463b",
                    "on-surface": "#1a1c1b",
                    "on-secondary-fixed": "#201b12",
                    "on-tertiary-container": "#fff6f2",
                    "surface-dim": "#dadad7",
                    "on-primary-fixed": "#000965",
                    "inverse-surface": "#2f312f",
                    "tertiary-fixed-dim": "#ffb778",
                    "on-secondary-container": "#6b6358",
                    "surface": "#f9f9f6",
                    "secondary-container": "#ece1d2",
                    "secondary": "#655d52",
                    "surface-container-lowest": "#ffffff",
                    "on-tertiary": "#ffffff",
                    "on-background": "#1a1c1b",
                    "error": "#ba1a1a",
                    "secondary-fixed": "#ece1d2",
                    "surface-container-high": "#e8e8e5",
                    "on-secondary": "#ffffff"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Manrope"],
                    "body": ["Inter"],
                    "label": ["Inter"]
            }
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .ease-out-quint {
        transition-timing-function: cubic-bezier(0.23, 1, 0.32, 1);
      }
      .scale-98-on-click:active {
        transform: scale(0.98);
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background font-body text-on-surface min-h-screen flex flex-col items-center">
<!-- Suppressing Navigation Shell as per Onboarding Rule -->
<main class="w-full max-w-2xl px-6 py-12 md:py-24 flex flex-col min-h-screen">
<!-- Brand Identity / Header -->
<div class="mb-12 flex flex-col items-center">
<span class="text-indigo-700 font-headline font-bold tracking-tighter text-2xl italic mb-8">BookLoom</span>
<div class="w-full flex justify-between mb-4">
<div class="h-1 w-[32%] bg-primary rounded-full"></div>
<div class="h-1 w-[32%] bg-surface-container-highest rounded-full"></div>
<div class="h-1 w-[32%] bg-surface-container-highest rounded-full"></div>
</div>
<p class="text-on-surface-variant font-label text-[11px] uppercase tracking-widest font-semibold">Step 1 of 3</p>
</div>
<!-- Headline Section -->
<div class="text-center mb-16">
<h1 class="font-headline font-extrabold text-4xl md:text-5xl lg:text-6xl text-on-surface tracking-tight leading-tight">
                What do you love <br/>
<span class="text-primary italic">reading?</span>
</h1>
<p class="mt-6 text-on-surface-variant text-lg max-w-md mx-auto leading-relaxed">
                We'll tailor your digital atelier with books that match your curiosity.
            </p>
</div>
<!-- Bento-style Category Grid -->
<div class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-24">
<!-- Active/Selected State Example -->
<button class="group relative flex flex-col items-center justify-center p-6 bg-indigo-50/50 rounded-xl border-2 border-primary/20 scale-98-on-click ease-out-quint duration-300">
<span class="material-symbols-outlined text-primary mb-3 text-3xl" style="font-variation-settings: 'FILL' 1;">auto_stories</span>
<span class="font-headline font-bold text-on-surface text-lg">Fiction</span>
<div class="absolute top-3 right-3 h-5 w-5 bg-primary rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-[14px] text-on-primary">check</span>
</div>
</button>
<!-- Inactive State -->
<button class="group flex flex-col items-center justify-center p-6 bg-surface-container-lowest rounded-xl hover:bg-surface-container transition-all scale-98-on-click ease-out-quint duration-300">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary mb-3 text-3xl">psychology</span>
<span class="font-headline font-semibold text-on-surface-variant group-hover:text-on-surface text-lg">Non-Fiction</span>
</button>
<button class="group flex flex-col items-center justify-center p-6 bg-surface-container-lowest rounded-xl hover:bg-surface-container transition-all scale-98-on-click ease-out-quint duration-300">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary mb-3 text-3xl">rocket_launch</span>
<span class="font-headline font-semibold text-on-surface-variant group-hover:text-on-surface text-lg">Sci-Fi</span>
</button>
<button class="group flex flex-col items-center justify-center p-6 bg-surface-container-lowest rounded-xl hover:bg-surface-container transition-all scale-98-on-click ease-out-quint duration-300">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary mb-3 text-3xl">ink_pen</span>
<span class="font-headline font-semibold text-on-surface-variant group-hover:text-on-surface text-lg">Poetry</span>
</button>
<button class="group flex flex-col items-center justify-center p-6 bg-surface-container-lowest rounded-xl hover:bg-surface-container transition-all scale-98-on-click ease-out-quint duration-300">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary mb-3 text-3xl">history_edu</span>
<span class="font-headline font-semibold text-on-surface-variant group-hover:text-on-surface text-lg">History</span>
</button>
<button class="group flex flex-col items-center justify-center p-6 bg-surface-container-lowest rounded-xl hover:bg-surface-container transition-all scale-98-on-click ease-out-quint duration-300">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary mb-3 text-3xl">mystery</span>
<span class="font-headline font-semibold text-on-surface-variant group-hover:text-on-surface text-lg">Mystery</span>
</button>
<button class="group flex flex-col items-center justify-center p-6 bg-surface-container-lowest rounded-xl hover:bg-surface-container transition-all scale-98-on-click ease-out-quint duration-300">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary mb-3 text-3xl">favorite</span>
<span class="font-headline font-semibold text-on-surface-variant group-hover:text-on-surface text-lg">Romance</span>
</button>
<button class="group flex flex-col items-center justify-center p-6 bg-surface-container-lowest rounded-xl hover:bg-surface-container transition-all scale-98-on-click ease-out-quint duration-300">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary mb-3 text-3xl">brush</span>
<span class="font-headline font-semibold text-on-surface-variant group-hover:text-on-surface text-lg">Art &amp; Design</span>
</button>
<button class="group flex flex-col items-center justify-center p-6 bg-surface-container-lowest rounded-xl hover:bg-surface-container transition-all scale-98-on-click ease-out-quint duration-300">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary mb-3 text-3xl">self_improvement</span>
<span class="font-headline font-semibold text-on-surface-variant group-hover:text-on-surface text-lg">Self Help</span>
</button>
</div>
<!-- Next Button - Sticky to bottom for mobile, fixed width for desktop -->
<div class="mt-auto pb-12 w-full flex flex-col items-center gap-6">
<button class="w-full bg-primary text-on-primary font-headline font-bold text-lg py-4 px-8 rounded-full shadow-lg shadow-primary/20 scale-98-on-click ease-out-quint duration-300 flex items-center justify-center group">
                Continue
                <span class="material-symbols-outlined ml-2 transition-transform group-hover:translate-x-1">arrow_forward</span>
</button>
<button class="text-on-surface-variant font-medium hover:text-on-surface transition-colors">
                Skip for now
            </button>
</div>
</main>
<!-- Visual Embellishment / Background Texture -->
<div class="fixed inset-0 pointer-events-none -z-10 opacity-30 overflow-hidden">
<div class="absolute -top-24 -left-24 w-96 h-96 bg-primary/10 rounded-full blur-[120px]"></div>
<div class="absolute top-1/2 -right-48 w-[500px] h-[500px] bg-secondary-container/20 rounded-full blur-[140px]"></div>
</div>
</body></html>
